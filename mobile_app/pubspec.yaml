name: yorgunluk_takip
description: Sürücü Yorgunluk Takip Sistemi - Firebase Bildirimler ile Güvenli Sürüş

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Local Notifications (kilitli ekranda da gösterir)
  flutter_local_notifications: ^17.2.2

  # HTTP (Python backend'e bağlantı için - durum güncellemeleri)
  http: ^1.2.2

  # Ses
  audioplayers: ^6.1.0

  # Titreşim
  vibration: ^2.0.0

  # Shared Preferences (ayarları kaydetmek için)
  shared_preferences: ^2.3.3

  # İkonlar
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10

  # Fontlar
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
